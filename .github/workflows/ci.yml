name: CI

# Third-party actions are pinned to full commit SHAs (the comment names the
# release); Dependabot proposes updates. Workflow tokens are read-only.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'
  COMPOSER_FUND: '0'

jobs:
  quality:
    name: Static analysis, style and schemas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: gd, exif, pcntl, posix, zip
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-progress --prefer-dist
      - run: composer dump-autoload --strict-psr --dry-run
      - run: composer format:check
      - run: composer analyse
      - run: composer schemas
      - run: composer audit

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [locked, highest, lowest]
    env:
      # The forked-worker suite must run here; a missing pcntl fails the job.
      REQUIRE_PCNTL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, exif, pcntl, posix, zip
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --no-progress --prefer-dist
      - name: Resolve highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --no-progress --prefer-dist --prefer-stable
      - name: Resolve lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --no-progress --prefer-dist --prefer-stable --prefer-lowest
      - run: vendor/bin/pest
      - name: Forked-worker suite ran (not skipped)
        run: vendor/bin/pest --group=process --fail-on-skipped

  minimal-extensions:
    name: Tests without exif, pcntl and zip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: gd, :exif, :pcntl, :zip
          coverage: none
          tools: composer:v2
      - name: Extensions are really absent
        run: |
          if php -m | grep -Eix 'exif|pcntl|zip'; then
            echo "an extension that must be absent is loaded" >&2
            exit 1
          fi
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/pest

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: gd, exif, pcntl, posix, zip
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-progress --prefer-dist
      - run: mkdir -p build && vendor/bin/pest --coverage --min=85 --coverage-clover=build/coverage.xml
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  mutation:
    name: Mutation testing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: gd, exif, pcntl, posix, zip
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-progress --prefer-dist
      - run: composer mutate

  consumer:
    name: Dist install in a fresh project (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, :exif, :pcntl, :zip
          coverage: none
          tools: composer:v2
      - run: tools/consumer/run.sh --prefer-lowest

  docker:
    name: Docker images build and run the suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose build --build-arg UID="$(id -u)" --build-arg GID="$(id -g)" php84 minimal
      - run: docker compose run --rm php84 sh -c 'composer install --no-progress && vendor/bin/pest'
      - run: docker compose run --rm minimal sh -c 'composer install --no-progress && vendor/bin/pest'

  gate:
    name: CI gate
    if: always()
    needs: [quality, tests, minimal-extensions, coverage, mutation, consumer, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"' && exit 1 || exit 0
