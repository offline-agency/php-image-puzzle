# Local development environment. Each PHP service keeps its own vendor
# volume, so containers never overwrite the host's vendor directory.
#
#   docker compose run --rm php85 composer install
#   docker compose run --rm php85 composer qa
#   docker compose run --rm php84 composer test
#   docker compose run --rm minimal composer test      # no exif/pcntl/zip
#   docker compose run --rm node npm ci && docker compose run --rm node npm test

x-php: &php
  volumes:
    - .:/app
  environment:
    COMPOSER_CACHE_DIR: /home/app/.composer/cache

services:
  php85:
    <<: *php
    build:
      context: .
      target: dev
      args:
        PHP_IMAGE: php:8.5-cli-trixie@sha256:635a4b998025ab269194639a5549c6fdcd9b4f88ec8cd761b092de8653d40663
    environment:
      REQUIRE_PCNTL: "1"
    volumes:
      - .:/app
      - vendor-php85:/app/vendor

  php84:
    <<: *php
    build:
      context: .
      target: dev
      args:
        PHP_IMAGE: php:8.4-cli-trixie@sha256:debadc2e36b857657846e2e952cbaf52702e55482dd3c2c43806f68d8c534a70
    environment:
      REQUIRE_PCNTL: "1"
    volumes:
      - .:/app
      - vendor-php84:/app/vendor

  minimal:
    <<: *php
    build:
      context: .
      target: minimal
      args:
        PHP_IMAGE: php:8.4-cli-trixie@sha256:debadc2e36b857657846e2e952cbaf52702e55482dd3c2c43806f68d8c534a70
    volumes:
      - .:/app
      - vendor-minimal:/app/vendor

  node:
    image: node:24-trixie-slim@sha256:43b9ba1142b8dcf33fa8f922ca1be85714adc444e0586c7cf7726daaeabc1bea
    working_dir: /app
    user: node
    volumes:
      - .:/app
      - node-modules:/app/node_modules

volumes:
  vendor-php85:
  vendor-php84:
  vendor-minimal:
  node-modules:
